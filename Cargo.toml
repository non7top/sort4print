[workspace]
resolver = "2"
members = ["core", "app", "tools/pack-cities", "tools/pack-flags"]

[workspace.package]
# No shared `version` here: release-please's `rust` release-type can't
# handle `version.workspace = true` in member manifests today (it always
# tries to patch each member's own `package.version` as a literal string —
# see googleapis/release-please#2478). Each member below carries its own
# literal version instead. TODO(non7top/sort4print#36): restore this once
# googleapis/release-please#2895 (open, unmerged) ships.
edition = "2021"

[workspace.dependencies]
anyhow = "1"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "tiff",
    "webp",
    "bmp",
] }
kamadak-exif = "0.6"
ab_glyph = "0.2"
ttf-parser = "0.25"
# Flags are SVG, rendered at whatever size the print needs. Text support is off
# on purpose: flags carry none, and it is what drags in a whole font stack.
resvg = { version = "0.48", default-features = false, features = ["svgz"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
