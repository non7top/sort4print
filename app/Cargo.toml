[package]
name = "sort4print"
version.workspace = true
edition.workspace = true

[dependencies]
sort4print-core = { path = "../core" }
anyhow.workspace = true
image.workspace = true
ab_glyph.workspace = true
# Both rendering backends are compiled in on purpose. wgpu (Direct3D 12 on
# Windows) is tried first and glow (OpenGL) is the fallback: OpenGL context
# creation fails outright on Windows installs with only the basic display
# driver and in remote desktop sessions, which is not a machine you can ask a
# user to stop having. Carrying both costs binary size and buys the program
# starting at all.
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "glow",
    "wgpu",
    "wayland",
    "x11",
] }
egui = "0.36"
rfd = "0.17"
